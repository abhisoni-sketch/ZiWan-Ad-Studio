<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenAI Production Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        .glow {
            box-shadow: 0 0 40px -10px rgba(124, 58, 237, 0.3);
        }
        .glass {
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(63, 63, 70, 0.5);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="h-full text-zinc-100 flex flex-col">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Custom SVG Icon Components for reliable rendering
        const IconUpload = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-upload-cloud"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>
        );
        const IconSettings = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        );
        const IconFilm = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-film"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M17 3v18"/><path d="M3 7h4"/><path d="M3 12h20"/><path d="M17 7h4"/><path d="M3 17h4"/><path d="M17 17h4"/></svg>
        );
        const IconCheck = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-check-circle"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
        );
        const IconClock = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-clock"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );
        const IconVideo = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="lucide lucide-video"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.934a.5.5 0 0 0-.777-.416L16 11"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
        );

        function App() {
            const [formData, setFormData] = useState({
                category_tab: 'mobile v2',
                model_target: 'veo-3.1-fast-generate-001',
                psn: 'MOBHH69N2XATECZZ',
                file: null,
                image_source_type: 'auto',
                image_gcs_folder: '',
                gdrive_folder_url: ''
            });
            const [uploading, setUploading] = useState(false);
            const [uploadSuccess, setUploadSuccess] = useState(false);
            const [fileGcsUri, setFileGcsUri] = useState('');
            const [availableTabs, setAvailableTabs] = useState([]);
            const [currentJobId, setCurrentJobId] = useState('');
            const [jobDetails, setJobDetails] = useState(null);
            const [jobsList, setJobsList] = useState([]);
            
            // NEW STATES
            const [catalogs, setCatalogs] = useState([]);
            const [selectedCatalog, setSelectedCatalog] = useState('');
            const [selectedCategories, setSelectedCategories] = useState([]);
            const [availablePsns, setAvailablePsns] = useState([]);
            const [selectedPsns, setSelectedPsns] = useState([]);
            const [selectAllPsns, setSelectAllPsns] = useState(false);
            const [psnSearchQuery, setPsnSearchQuery] = useState('');
            
            const [settings, setSettings] = useState({
                model_text: 'gemini-3.1-pro-preview',
                model_video: 'gemini-omni-flash-preview',
                model_tts: 'gemini-3.1-flash-tts-preview',
                model_bgm: 'lyria-3-pro-preview',
                gcp_location: 'global'
            });
            const [showSettings, setShowSettings] = useState(false);
            
            const [appConfig, setAppConfig] = useState({ project_id: '', location: '', ingest_bucket: '' });
            
            const [activeTab, setActiveTab] = useState('studio');
            const [simulation, setSimulation] = useState(null);
            const [simParams, setSimParams] = useState({
                video_volume: 100,
                discount_percent: 10,
                custom_margin_percent: 15,
                avg_duration_sec: 30,
                gcp_location: 'asia-south1'
            });

            // Trigger Pricing Calculator Simulation on parameters change
            useEffect(() => {
                if (activeTab !== 'calculator') return;
                
                const data = new URLSearchParams();
                data.append("video_volume", simParams.video_volume);
                data.append("discount_percent", simParams.discount_percent);
                data.append("custom_margin_percent", simParams.custom_margin_percent);
                data.append("model_text", settings.model_text);
                data.append("model_video", settings.model_video);
                data.append("model_tts", settings.model_tts);
                data.append("model_bgm", settings.model_bgm);
                data.append("avg_duration_sec", simParams.avg_duration_sec);
                data.append("gcp_location", simParams.gcp_location);
                
                fetch("/api/finops/calculate-simulation", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: data
                })
                .then(res => res.json())
                .then(data => setSimulation(data))
                .catch(err => console.error("Simulation error:", err));
            }, [simParams, settings, activeTab]);
            
            const [showAuditTrail, setShowAuditTrail] = useState(false);
            const [auditRecords, setAuditRecords] = useState([]);

            const openAuditTrail = () => {
                setShowAuditTrail(true);
                fetch('/api/audit-trail')
                    .then(res => res.json())
                    .then(data => setAuditRecords(data.audit_records || []))
                    .catch(err => console.error("Error loading audit records:", err));
            };

            // Listen for details if a job is active
            useEffect(() => {
                if (!currentJobId) return;
                
                if (window.EventSource) {
                    const eventSource = new EventSource(`/api/jobs/${currentJobId}/stream`);
                    
                    eventSource.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        if (data.status === 'not_found') {
                            eventSource.close();
                            return;
                        }
                        setJobDetails(data);
                        loadJobs();
                        if (data.status === 'COMPLETED' || data.status === 'failed') {
                            eventSource.close();
                        }
                    };
                    
                    eventSource.onerror = (err) => {
                        console.error("SSE Error:", err);
                        eventSource.close();
                    };
                    
                    return () => eventSource.close();
                } else {
                    let interval = setInterval(() => {
                        fetch(`/api/jobs/${currentJobId}`)
                            .then(res => res.json())
                            .then(data => {
                                setJobDetails(data);
                                loadJobs();
                                if (data.status === 'COMPLETED' || data.status === 'failed') {
                                    clearInterval(interval);
                                }
                            })
                            .catch(err => console.error("Error fetching job state:", err));
                    }, 1000);
                    return () => clearInterval(interval);
                }
            }, [currentJobId]);

            // Initial load of jobs list and catalogs
            useEffect(() => {
                loadJobs();
                loadCatalogs();
                
                fetch('/api/config')
                    .then(res => res.json())
                    .then(data => setAppConfig(data))
                    .catch(err => console.error("Error loading config:", err));
            }, []);

            const loadJobs = () => {
                fetch('/api/jobs')
                    .then(res => res.json())
                    .then(data => setJobsList(data))
                    .catch(err => console.error("Error loading jobs:", err));
            };

            const loadCatalogs = () => {
                fetch('/api/catalogs')
                    .then(res => res.json())
                    .then(data => setCatalogs(data.catalogs || []))
                    .catch(err => console.error("Error loading catalogs:", err));
            };

            const handleDeleteCatalog = (filename) => {
                if (confirm(`Are you sure you want to delete ${filename}?`)) {
                    fetch(`/api/catalogs/${filename}`, { method: 'DELETE' })
                        .then(() => {
                            if (selectedCatalog === filename) {
                                setSelectedCatalog('');
                                setFileGcsUri('');
                            }
                            loadCatalogs();
                        })
                        .catch(err => console.error("Error deleting catalog:", err));
                }
            };

            // Inspect PSNs when file or categories change
            useEffect(() => {
                if (fileGcsUri) {
                    const data = new URLSearchParams();
                    data.append('file_gcs_uri', fileGcsUri);
                    if (selectedCategories.length > 0) {
                        data.append('category_tabs', selectedCategories.join(','));
                    }
                    
                    fetch('/api/inspect-psns', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: data
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.available_psns) {
                            setAvailablePsns(data.available_psns);
                            setSelectedPsns([]);
                            setSelectAllPsns(false);
                        }
                    })
                    .catch(err => console.error("Error inspecting PSNs:", err));
                }
            }, [fileGcsUri, selectedCategories]);
            
            const handleSelectAllPsnsToggle = () => {
                const toggled = !selectAllPsns;
                setSelectAllPsns(toggled);
                if (toggled) {
                    setSelectedPsns([...availablePsns]);
                } else {
                    setSelectedPsns([]);
                }
            };

            const handleFileChange = async (e) => {
                const selectedFile = e.target.files[0];
                if (!selectedFile) return;
                
                setFormData({ ...formData, file: selectedFile });
                setUploading(true);
                setUploadSuccess(false);

                const data = new FormData();
                data.append("file", selectedFile);

                try {
                    const res = await fetch("/api/upload", {
                        method: "POST",
                        body: data
                    });
                    const resJson = await res.json();
                    setFileGcsUri(resJson.file_gcs_uri);
                    setUploadSuccess(true);
                    if (resJson.available_tabs && resJson.available_tabs.length > 0) {
                        setAvailableTabs(resJson.available_tabs);
                        setFormData(prev => ({ ...prev, category_tab: resJson.available_tabs[0] }));
                        setSelectedCategories([resJson.available_tabs[0]]);
                    }
                } catch (error) {
                    console.error("Upload failed:", error);
                    alert("Failed to upload sheet file.");
                } finally {
                    setUploading(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!fileGcsUri) {
                    alert("Please select or upload a Catalog file first!");
                    return;
                }

                const psnsToDispatch = (selectAllPsns || selectedPsns.length > 0) 
                                        ? selectedPsns 
                                        : (formData.psn ? [formData.psn] : []);
                
                if (psnsToDispatch.length === 0) {
                    alert("Please select at least one PSN!");
                    return;
                }

                for (const targetPsn of psnsToDispatch) {
                    const payload = new URLSearchParams();
                    payload.append("category_tab", selectedCategories[0] || formData.category_tab);
                    payload.append("model_target", formData.model_target);
                    payload.append("psn", targetPsn);
                    payload.append("file_gcs_uri", fileGcsUri);
                    payload.append("image_source_type", formData.image_source_type);
                    payload.append("image_gcs_folder", formData.image_gcs_folder || "");
                    payload.append("gdrive_folder_url", formData.gdrive_folder_url || "");
                    
                    // Append settings
                    payload.append("model_text", settings.model_text);
                    payload.append("model_video", settings.model_video);
                    payload.append("model_tts", settings.model_tts);
                    payload.append("model_bgm", settings.model_bgm);
                    payload.append("gcp_location", settings.gcp_location);

                    try {
                        const res = await fetch("/api/jobs", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded"
                            },
                            body: payload
                        });
                        const resJson = await res.json();
                        setCurrentJobId(resJson.job_id);
                        setJobDetails({ status: 'ingesting' });
                    } catch (error) {
                        console.error("Dispatching agents failed:", error);
                        alert(`Failed to dispatch for PSN ${targetPsn}`);
                    }
                }
                loadJobs();
            };

            const selectJob = (jobId) => {
                setCurrentJobId(jobId);
                fetch(`/api/jobs/${jobId}`)
                    .then(res => res.json())
                    .then(data => setJobDetails(data))
                    .catch(err => console.error("Error loading selected job details:", err));
            };

            // Map status string to frontend timeline steps and colors
            const getStepStatus = (stepName) => {
                if (!jobDetails) return 'pending';
                const status = jobDetails.status;
                
                if (status === 'failed') return 'failed';

                const order = [
                    'ingesting', 
                    'context_extracting', 
                    'context_extracted', 
                    'script_generating', 
                    'script_generated', 
                    'segments_creating', 
                    'segments_created', 
                    'generating_clips', 
                    'clips_generated', 
                    'verifying_clips', 
                    'clips_verified', 
                    'stitching', 
                    'COMPLETED'
                ];

                const currentIdx = order.indexOf(status);

                const stepMap = {
                    'context': ['context_extracting', 'context_extracted'],
                    'script': ['script_generating', 'script_generated'],
                    'segments': ['segments_creating', 'segments_created'],
                    'generation': ['generating_clips', 'clips_generated'],
                    'verification': ['verifying_clips', 'clips_verified'],
                    'stitch': ['stitching', 'COMPLETED']
                };

                const subSteps = stepMap[stepName];
                const activeState = subSteps[0];
                const completeState = subSteps[1];

                if (status === 'COMPLETED' || order.indexOf(status) >= order.indexOf(completeState)) {
                    return 'complete';
                }
                if (status === activeState || order.indexOf(status) === order.indexOf(activeState)) {
                    return 'active';
                }
                return 'pending';
            };

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col">
                    {/* Header */}
                    <header className="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur-md px-8 py-5">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-6">
                                <div>
                                    <h1 className="text-2xl font-bold bg-gradient-to-r from-violet-400 via-fuchsia-400 to-pink-400 bg-clip-text text-transparent">
                                        GenAI Production Studio
                                    </h1>
                                    <p className="text-xs text-zinc-500 mt-1 uppercase tracking-widest font-semibold">
                                        Elite Multi-Agent Orchestrator • Inform, Don't Advertise
                                    </p>
                                </div>
                                {/* Navigation Switcher */}
                                <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-1 flex gap-1">
                                    <button 
                                        onClick={() => setActiveTab('studio')} 
                                        className={`text-xs font-bold uppercase px-3 py-1.5 rounded-lg transition ${activeTab === 'studio' ? 'bg-violet-600 text-white' : 'text-zinc-400 hover:text-zinc-200'}`}
                                    >
                                        🎬 Studio
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('calculator')} 
                                        className={`text-xs font-bold uppercase px-3 py-1.5 rounded-lg transition ${activeTab === 'calculator' ? 'bg-violet-600 text-white' : 'text-zinc-400 hover:text-zinc-200'}`}
                                    >
                                        📊 FinOps Calculator
                                    </button>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setShowSettings(true)} className="p-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-zinc-300 border border-zinc-700 transition flex items-center justify-center" title="Engine Settings">
                                    <IconSettings />
                                </button>
                                <button onClick={openAuditTrail} className="text-xs font-bold uppercase tracking-wider bg-zinc-800 hover:bg-zinc-700 px-4 py-2 rounded-xl text-zinc-300 border border-zinc-700 transition">
                                    Audit Trail
                                </button>
                                <div className="flex items-center gap-2">
                                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span className="text-xs text-zinc-400 font-mono">{appConfig.project_id ? `${appConfig.project_id} Project Environment` : 'GCP Project Environment'}</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-8 overflow-y-auto">
                        {activeTab === 'studio' ? (
                            <div className="grid grid-cols-12 gap-8">
                        
                        {/* LEFT COLUMN: CONFIGURATION (Col span 4) */}
                        <div className="col-span-12 lg:col-span-4 space-y-6">
                            
                            {/* Job Configuration */}
                            <div className="glass p-6 rounded-2xl glow">
                                <h2 className="text-lg font-bold text-zinc-100 flex items-center gap-2 mb-6">
                                    <span className="text-violet-500"><IconSettings /></span>
                                    New Production Job
                                </h2>
                                
                                <form onSubmit={handleSubmit} className="space-y-5 text-sm">
                                    {/* CATALOG VAULT */}
                                    <div>
                                        <label className="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                                            CATALOG VAULT
                                        </label>
                                        <div className="flex items-center gap-2 mb-3">
                                            <select 
                                                value={selectedCatalog}
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    setSelectedCatalog(val);
                                                    if(val) {
                                                        const cat = catalogs.find(c => c.filename === val);
                                                        if(cat) {
                                                            setFileGcsUri(`gs://${appConfig.ingest_bucket || 'your-gcp-project-id-ingest-vault'}/${val}`);
                                                            if (cat.available_tabs && cat.available_tabs.length > 0) {
                                                                setAvailableTabs(cat.available_tabs);
                                                                setSelectedCategories([cat.available_tabs[0]]);
                                                            }
                                                        }
                                                    } else {
                                                        setFileGcsUri('');
                                                    }
                                                }}
                                                className="flex-1 min-w-0 border border-zinc-800 rounded-xl p-3 bg-zinc-900 text-zinc-100 text-xs focus:outline-none focus:border-violet-500 overflow-hidden text-ellipsis whitespace-nowrap"
                                            >
                                                <option value="">-- Select from Vault --</option>
                                                {catalogs.map(cat => (
                                                    <option key={cat.filename} value={cat.filename}>{cat.filename}</option>
                                                ))}
                                            </select>
                                            {selectedCatalog && (
                                                <button type="button" onClick={() => handleDeleteCatalog(selectedCatalog)} className="shrink-0 px-3 py-3 bg-red-950/40 text-red-400 border border-red-900 rounded-xl hover:bg-red-900/50 text-xs font-semibold">
                                                    Delete
                                                </button>
                                            )}
                                        </div>
                                        <label className="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                                            OR UPLOAD NEW SHEET (.xlsx or .csv)
                                        </label>
                                        <div className="relative border border-dashed border-zinc-700 hover:border-violet-500/70 transition rounded-xl bg-zinc-900/40 p-4 flex flex-col items-center justify-center cursor-pointer">
                                            <input 
                                                type="file" 
                                                accept=".xlsx, .xls, .csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel, text/csv"
                                                className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                                onChange={handleFileChange}
                                            />
                                            <div className="text-zinc-500 flex flex-col items-center gap-2">
                                                <span className="text-zinc-400"><IconUpload /></span>
                                                {formData.file ? (
                                                    <span className="text-xs font-semibold text-zinc-300 truncate max-w-[200px]">
                                                        {formData.file.name}
                                                    </span>
                                                ) : (
                                                    <span className="text-xs">Click to browse Excel (.xlsx) or CSV file</span>
                                                )}
                                            </div>
                                            {uploading && <div className="absolute inset-0 bg-zinc-950/80 rounded-xl flex items-center justify-center text-xs text-violet-400 animate-pulse">Uploading file...</div>}
                                            {uploadSuccess && <div className="absolute top-2 right-2 text-emerald-500"><IconCheck /></div>}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                                            Product Category (Tabs)
                                        </label>
                                        <div className="flex flex-wrap gap-2">
                                            {(availableTabs.length > 0 ? availableTabs : []).map(tab => {
                                                const isSelected = selectedCategories.includes(tab);
                                                return (
                                                    <button
                                                        key={tab}
                                                        type="button"
                                                        onClick={() => {
                                                            if (isSelected) {
                                                                setSelectedCategories(selectedCategories.filter(c => c !== tab));
                                                            } else {
                                                                setSelectedCategories([...selectedCategories, tab]);
                                                            }
                                                        }}
                                                        className={`px-3 py-1.5 text-xs rounded-full border transition ${isSelected ? 'bg-violet-600/30 border-violet-500 text-violet-200' : 'bg-zinc-900 border-zinc-800 text-zinc-400 hover:bg-zinc-800'}`}
                                                    >
                                                        {tab}
                                                    </button>
                                                );

                                                        <span className="text-2xl font-extrabold text-emerald-400 font-mono mt-1 block">${simulation.discount_savings_usd.toFixed(2)}</span>
                                                    </div>
                                                    <div className="glass p-5 rounded-2xl border-l-4 border-fuchsia-500">
                                                        <span className="text-[10px] font-bold text-zinc-500 uppercase tracking-wider block">Video Unit Cost</span>
                                                        <span className="text-2xl font-extrabold text-zinc-100 font-mono mt-1 block">${simulation.single_unit_cost_usd.toFixed(4)}</span>
                                                    </div>
                                                </div>

                                                {/* Detailed distribution card */}
                                                <div className="glass p-6 rounded-2xl space-y-6">
                                                    <h4 className="text-xs font-bold uppercase tracking-wider text-zinc-400">Infrastructure cost distribution</h4>
                                                    
                                                    {/* Color coded distribution bar */}
                                                    {(() => {
                                                        const breakdown = simulation.component_total_breakdown;
                                                        const sum = breakdown.text_reasoning_llm + breakdown.video_generation + breakdown.voice_tts + breakdown.bgm_music + breakdown.compute_infrastructure;
                                                        const videoPct = sum === 0 ? 0 : (breakdown.video_generation / sum) * 100;
                                                        const audioPct = sum === 0 ? 0 : ((breakdown.voice_tts + breakdown.bgm_music) / sum) * 100;
                                                        const llmPct = sum === 0 ? 0 : (breakdown.text_reasoning_llm / sum) * 100;
                                                        const computePct = sum === 0 ? 0 : (breakdown.compute_infrastructure / sum) * 100;
                                                        
                                                        return (
                                                            <>
                                                                <div className="h-6 w-full rounded-full overflow-hidden flex text-[10px] font-bold text-white font-mono">
                                                                    <div style={{ width: `${videoPct}%` }} className="bg-violet-600 h-full flex items-center justify-center" title="Video Generation">
                                                                        {videoPct > 10 && 'VIDEO'}
                                                                    </div>
                                                                    <div style={{ width: `${audioPct}%` }} className="bg-pink-500 h-full flex items-center justify-center" title="Voice & BGM">
                                                                        {audioPct > 10 && 'AUDIO'}
                                                                    </div>
                                                                    <div style={{ width: `${llmPct}%` }} className="bg-fuchsia-600 h-full flex items-center justify-center" title="LLM reasoning">
                                                                        {llmPct > 10 && 'LLM'}
                                                                    </div>
                                                                    <div style={{ width: `${computePct}%` }} className="bg-zinc-700 h-full flex items-center justify-center" title="Infrastructure compute">
                                                                        {computePct > 10 && 'INFRA'}
                                                                    </div>
                                                                </div>

                                                                {/* Legend grid */}
                                                                <div className="grid grid-cols-2 gap-4 text-xs">
                                                                    <div className="flex items-center gap-3">
                                                                        <span className="w-3 h-3 rounded-full bg-violet-600"></span>
                                                                        <div className="flex-1 flex justify-between">
                                                                            <span className="text-zinc-400">Video Generation:</span>
                                                                            <span className="font-mono text-zinc-200">${simulation.component_total_breakdown.video_generation.toFixed(2)} ({videoPct.toFixed(1)}%)</span>
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-3">
                                                                        <span className="w-3 h-3 rounded-full bg-pink-500"></span>
                                                                        <div className="flex-1 flex justify-between">
                                                                            <span className="text-zinc-400">Voice & BGM Audio:</span>
                                                                            <span className="font-mono text-zinc-200">${(simulation.component_total_breakdown.voice_tts + simulation.component_total_breakdown.bgm_music).toFixed(2)} ({audioPct.toFixed(1)}%)</span>
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-3">
                                                                        <span className="w-3 h-3 rounded-full bg-fuchsia-600"></span>
                                                                        <div className="flex-1 flex justify-between">
                                                                            <span className="text-zinc-400">Text Reasoning LLM:</span>
                                                                            <span className="font-mono text-zinc-200">${simulation.component_total_breakdown.text_reasoning_llm.toFixed(2)} ({llmPct.toFixed(1)}%)</span>
                                                                        </div>
                                                                    </div>
                                                                    <div className="flex items-center gap-3">
                                                                        <span className="w-3 h-3 rounded-full bg-zinc-700"></span>
                                                                        <div className="flex-1 flex justify-between">
                                                                            <span className="text-zinc-400">Cloud Run Compute:</span>
                                                                            <span className="font-mono text-zinc-200">${simulation.component_total_breakdown.compute_infrastructure.toFixed(2)} ({computePct.toFixed(1)}%)</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </>
                                                        );
                                                    })()}
                                                </div>

                                                {/* Detailed pricing specs */}
                                                <div className="glass p-6 rounded-2xl text-xs space-y-4">
                                                    <h4 className="text-xs font-bold uppercase tracking-wider text-zinc-400">Unit Rates Applied ({simulation.gcp_location})</h4>
                                                    <div className="grid grid-cols-2 gap-x-8 gap-y-2 font-mono text-zinc-400">
                                                        <div className="flex justify-between border-b border-zinc-800 pb-1">
                                                            <span>Gemini Pro Text Input /1k:</span>
                                                            <span className="text-zinc-200">${simulation.rates_used.gemini_31_pro_text_in_1k.toFixed(5)}</span>
                                                        </div>
                                                        <div className="flex justify-between border-b border-zinc-800 pb-1">
                                                            <span>Gemini Pro Text Output /1k:</span>
                                                            <span className="text-zinc-200">${simulation.rates_used.gemini_31_pro_text_out_1k.toFixed(5)}</span>
                                                        </div>
                                                        <div className="flex justify-between border-b border-zinc-800 pb-1">
                                                            <span>Veo Video Generation /sec:</span>
                                                            <span className="text-zinc-200">${simulation.rates_used.veo_20_video_sec.toFixed(5)}</span>
                                                        </div>
                                                        <div className="flex justify-between border-b border-zinc-800 pb-1">
                                                            <span>Gemini Omni Video Gen /sec:</span>
                                                            <span className="text-zinc-200">${simulation.rates_used.gemini_omni_flash_video_sec.toFixed(5)}</span>
                                                        </div>
                                                        <div className="flex justify-between border-b border-zinc-800 pb-1">
                                                            <span>Gemini TTS Character /1k:</span>
                                                            <span className="text-zinc-200">${simulation.rates_used.gemini_31_tts_char_1k.toFixed(5)}</span>
                                                        </div>
                                                        <div className="flex justify-between border-b border-zinc-800 pb-1">
                                                            <span>Lyria 3 BGM Audio /sec:</span>
                                                            <span className="text-zinc-200">${simulation.rates_used.lyria_3_bgm_sec.toFixed(5)}</span>
                                                        </div>
                                                        <div className="flex justify-between border-b border-zinc-800 pb-1">
                                                            <span>Cloud Run Compute vCPU/sec:</span>
                                                            <span className="text-zinc-200">${simulation.rates_used.cloud_run_vcpu_sec.toFixed(8)}</span>
                                                        </div>
                                                        <div className="flex justify-between border-b border-zinc-800 pb-1">
                                                            <span>Cloud Run Compute RAM/sec:</span>
                                                            <span className="text-zinc-200">${simulation.rates_used.cloud_run_ram_gib_sec.toFixed(8)}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {showAuditTrail && (
                            <div className="fixed inset-0 bg-zinc-950/80 backdrop-blur-sm z-50 flex justify-end">
                                <div className="w-full max-w-2xl bg-zinc-900 border-l border-zinc-800 h-full overflow-y-auto p-6 shadow-2xl animate-slide-in">
                                    <div className="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                                        <h2 className="text-xl font-bold text-zinc-100 flex items-center gap-2">
                                            <IconSettings /> Enterprise Audit Trail
                                        </h2>
                                        <button onClick={() => setShowAuditTrail(false)} className="text-zinc-500 hover:text-zinc-300 transition">
                                            Close (Esc)
                                        </button>
                                    </div>
                                    <div className="space-y-4">
                                        {auditRecords.length === 0 ? (
                                            <p className="text-zinc-500 text-sm text-center py-8">No historical job runs found.</p>
                                        ) : (
                                            auditRecords.map(rec => (
                                                <div key={rec.job_id} className="bg-zinc-950 border border-zinc-800 rounded-xl p-4">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div>
                                                            <div className="text-xs text-violet-400 font-mono font-bold mb-1">{rec.job_id}</div>
                                                            <div className="text-sm font-semibold text-zinc-200">{rec.psn} <span className="text-zinc-500 font-normal">({rec.category})</span></div>
                                                        </div>
                                                        <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${rec.status === 'COMPLETED' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/30' : rec.status === 'failed' ? 'bg-red-950 text-red-400 border border-red-800/30' : 'bg-zinc-800 text-zinc-400'}`}>
                                                            {rec.status}
                                                        </span>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-4 text-xs mt-3">
                                                        <div><span className="text-zinc-500">Model:</span> <span className="text-zinc-300">{rec.model_target}</span></div>
                                                        <div><span className="text-zinc-500">Segments:</span> <span className="text-zinc-300">{rec.segments}</span></div>
                                                        <div className="col-span-2 text-zinc-500">
                                                            {rec.final_video_uri && (
                                                                <a href={`/api/video/${rec.job_id}`} target="_blank" className="text-violet-400 hover:underline">View Final Output</a>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {showSettings && (
                            <div className="fixed inset-0 bg-zinc-950/80 backdrop-blur-sm z-50 flex justify-end">
                                <div className="w-full max-w-md bg-zinc-900 border-l border-zinc-800 h-full overflow-y-auto p-6 shadow-2xl animate-slide-in flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                                            <h2 className="text-xl font-bold text-zinc-100 flex items-center gap-2">
                                                <IconSettings /> GenAI Engine Settings
                                            </h2>
                                            <button onClick={() => setShowSettings(false)} className="text-zinc-500 hover:text-zinc-300 transition">
                                                Close
                                            </button>
                                        </div>
                                        <div className="space-y-4 text-sm">
                                            <div>
                                                <label className="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                                                    Scripting/Reasoning LLM
                                                </label>
                                                <select 
                                                    value={settings.model_text}
                                                    onChange={(e) => setSettings({ ...settings, model_text: e.target.value })}
                                                    className="w-full border border-zinc-800 rounded-xl p-3 bg-zinc-900 text-zinc-100 focus:outline-none focus:border-violet-500 hover:bg-zinc-800/50"
                                                >
                                                    <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro (Elite Reasoning)</option>
                                                    <option value="gemini-3.5-flash">Gemini 3.5 Flash (Ultra Fast)</option>
                                                    <option value="gemini-3.0-pro">Gemini 3.0 Pro</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                                                    Video Generation Model
                                                </label>
                                                <select 
                                                    value={settings.model_video}
                                                    onChange={(e) => setSettings({ ...settings, model_video: e.target.value })}
                                                    className="w-full border border-zinc-800 rounded-xl p-3 bg-zinc-900 text-zinc-100 focus:outline-none focus:border-violet-500 hover:bg-zinc-800/50"
                                                >
                                                    <option value="gemini-omni-flash-preview">Gemini Omni Flash (Coherent Voice + Video)</option>
                                                    <option value="veo-2.0-generate-001">Veo 2.0 (High Resolution Cinematic)</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                                                    Voice TTS Model
                                                </label>
                                                <select 
                                                    value={settings.model_tts}
                                                    onChange={(e) => setSettings({ ...settings, model_tts: e.target.value })}
                                                    className="w-full border border-zinc-800 rounded-xl p-3 bg-zinc-900 text-zinc-100 focus:outline-none focus:border-violet-500 hover:bg-zinc-800/50"
                                                >
                                                    <option value="gemini-3.1-flash-tts-preview">Gemini 3.1 Flash TTS (Native Expressive)</option>
                                                    <option value="en-US-Journey-F">Cloud TTS en-US-Journey-F (Expressive Accent)</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                                                    BGM Audio Model
                                                </label>
                                                <select 
                                                    value={settings.model_bgm}
                                                    onChange={(e) => setSettings({ ...settings, model_bgm: e.target.value })}
                                                    className="w-full border border-zinc-800 rounded-xl p-3 bg-zinc-900 text-zinc-100 focus:outline-none focus:border-violet-500 hover:bg-zinc-800/50"
                                                >
                                                    <option value="lyria-3-pro-preview">Lyria 3 Pro (Generative Instrumental)</option>
                                                    <option value="python-synth">Python Synthesizer (Local Fallback Synth)</option>
                                                </select>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                                                    GCP Region / Location
                                                </label>
                                                <select 
                                                    value={settings.gcp_location}
                                                    onChange={(e) => setSettings({ ...settings, gcp_location: e.target.value })}
                                                    className="w-full border border-zinc-800 rounded-xl p-3 bg-zinc-900 text-zinc-100 focus:outline-none focus:border-violet-500 hover:bg-zinc-800/50"
                                                >
                                                    <option value="global">Global (Default Multi-Region Routing)</option>
                                                    <option value="us-central1">us-central1 (Iowa)</option>
                                                    <option value="asia-south1">asia-south1 (Mumbai)</option>
                                                    <option value="europe-west4">europe-west4 (Eemshaven)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowSettings(false)} className="w-full bg-violet-600 hover:bg-violet-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-violet-950/50 duration-150 mt-6">
                                        Save Configurations
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        function PipelineStep({ title, desc, status }) {
            const getColors = () => {
                if (status === 'complete') return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                if (status === 'active') return 'bg-violet-500/10 text-violet-400 border-violet-500/40 animate-pulse';
                if (status === 'failed') return 'bg-red-500/10 text-red-400 border-red-500/40';
                return 'bg-zinc-900/50 text-zinc-600 border-zinc-800/50';
            };

            return (
                <div className="relative flex items-start gap-4 py-1.5">
                    <div className={`absolute -left-[2.05rem] w-6 h-6 rounded-full flex items-center justify-center border bg-zinc-950 z-10 ${getColors()}`}>
                        {status === 'complete' ? <IconCheck /> : <div className="w-1.5 h-1.5 rounded-full bg-current" />}
                    </div>
                    <div>
                        <h4 className={`text-sm font-semibold transition-colors ${status === 'pending' ? 'text-zinc-600' : 'text-zinc-200'}`}>{title}</h4>
                        <p className="text-[11px] text-zinc-500 mt-0.5 leading-normal">{desc}</p>
                    </div>
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
