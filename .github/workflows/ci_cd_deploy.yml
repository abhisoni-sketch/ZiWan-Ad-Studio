# ==============================================================================
# ZiWan Ad Studio — GitHub Actions CI/CD Pipeline
# ==============================================================================
# Automated workflow for:
# 1. Python Linting & Test Verification
# 2. Terraform Code Formatting & Validation
# 3. Docker Image Build & Push to GCP Artifact Registry
# 4. Automated Cloud Run Service Deployment
# ==============================================================================

name: ZiWan Ad Studio CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Code Linting & Security Verification
  # ----------------------------------------------------------------------------
  lint-and-test:
    name: Lint Code & Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r requirements.txt

      - name: Run Flake8 Code Quality Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Validate Terraform Syntax
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # ----------------------------------------------------------------------------
  # Job 2: Build & Deploy to Google Cloud Run (Pushes on main branch)
  # ----------------------------------------------------------------------------
  deploy-cloud-run:
    name: Build & Deploy to GCP Cloud Run
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: us-central1
      SERVICE_NAME: ziwan-ad-studio
      REPO_NAME: ziwan-ad-studio-repo

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Container Image
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:${{ github.sha }}"
          LATEST_URI="us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:latest"
          
          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated
