# ==============================================================================
# ZiWan Ad Studio — GitHub Actions Code Quality & Validation Pipeline
# ==============================================================================
# Automated validation workflow for:
# 1. Python Syntax & Quality Checks (Flake8)
# 2. Terraform Infrastructure Validation (HCL Syntax & Provider Check)
# NOTE: No automated deployments are executed by this workflow.
# ==============================================================================

name: ZiWan Ad Studio Code Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Lint Code & Validate Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 -r requirements.txt

      - name: Run Flake8 Code Quality Check
        run: |
          # Verify Python syntax and static analysis rules
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Validate Terraform Syntax
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -recursive
          terraform validate
